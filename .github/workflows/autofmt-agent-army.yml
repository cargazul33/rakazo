name: Autoformat agent army branch

on:
  push:
    branches:
      - feat/serverless-agent-control-plane

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/serverless-agent-control-plane
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check --write apps/control-plane/src/index.ts apps/web/src/App.tsx apps/web/src/pages/AgentCommandCenter.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-plane/src/index.ts apps/web/src/App.tsx apps/web/src/pages/AgentCommandCenter.tsx
          git commit -m "style: format agent control plane"
          git push origin HEAD:feat/serverless-agent-control-plane
